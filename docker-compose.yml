version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: taki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-takidemo}
      POSTGRES_USER: ${POSTGRES_USER:-takidemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takidemo_local_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takidemo} -d ${POSTGRES_DB:-takidemo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taki-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taki-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-takidemo}
      DB_USER: ${POSTGRES_USER:-takidemo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-takidemo_local_pw}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-dev-secret-please-32chars-min}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-80},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - taki-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: taki-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - taki-net

networks:
  taki-net:
    driver: bridge

volumes:
  postgres-data:
