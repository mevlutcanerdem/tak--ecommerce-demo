# Demo-only credentials for a local Minikube/Docker-Desktop cluster.
# Do not reuse these values anywhere real. For production use a proper
# secret manager (Sealed Secrets, External Secrets, cloud KMS, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taki-demo
type: Opaque
stringData:
  POSTGRES_DB: takidemo
  POSTGRES_USER: takidemo
  POSTGRES_PASSWORD: takidemo_local_pw
