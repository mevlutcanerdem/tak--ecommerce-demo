apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taki-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Built locally and loaded into the cluster's image store, e.g.:
          #   eval $(minikube docker-env) && docker build -t taki-frontend:local ./frontend
          # or: minikube image load taki-frontend:local
          image: taki-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
